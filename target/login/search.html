<!DOCTYPE html>
<html>
<head>
    <title>Google Fetcher</title>
    <style>
        body { font-family: sans-serif; margin: 40px; text-align: center; }
        input[type="text"] { padding: 10px; width: 250px; border-radius: 4px; border: 1px solid #ddd; }
        button { padding: 10px 20px; background-color: #4285F4; color: white; border: none; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
    <h2>Search Google via Servlet</h2>
    <form action="fetch" method="GET">
        <input type="text" name="query" placeholder="What are you looking for?" required>
        <button type="submit">Fetch</button>
    </form>
</body>
</html>
